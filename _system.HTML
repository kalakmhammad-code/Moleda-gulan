<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حیساباتی مۆلیدە</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
            overflow-x: hidden;
        }
        /* Rectangular subscriber cards with status colors */
        .sub-card-paid {
            background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
            border-color: #10b981;
        }
        .sub-card-unpaid {
            background: linear-gradient(135deg, #450a0a 0%, #7f1d1d 100%);
            border-color: #ef4444;
        }
        .sub-card-inactive {
            background: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
            border-color: #475569;
            opacity: 0.9;
        }
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #print-receipt-area, #print-receipt-area * {
                visibility: visible;
            }
            #print-receipt-area {
                position: fixed;
                inset: 0;
                background: #ffffff !important;
                color: #0f172a !important;
                padding: 24px;
                display: block !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 sm:px-6 py-3">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
            <!-- Brand & Month Info -->
            <div class="flex items-center justify-between gap-3">
                <div>
                    <h1 id="app-title" class="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
                        <span>حیساباتی مۆلیدە</span>
                        <span id="current-month-badge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40"></span>
                    </h1>
                    <p id="app-subtitle" class="text-xs text-slate-400 mt-0.5"></p>
                </div>
            </div>

            <!-- Role Switcher, Sync Status & Language Toggle -->
            <div class="flex items-center gap-2 flex-wrap">
                <span id="online-sync-badge" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-emerald-950 text-emerald-300 border border-emerald-700/70 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="lbl-online-status">ئۆنلاین • هاوبەش</span>
                </span>

                <button type="button" id="btn-share-link" onclick="copyLiveSessionLink()" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-700 transition">
                    لینکی هاوبەش
                </button>

                <!-- Role Buttons -->
                <div class="inline-flex rounded-xl bg-slate-950 p-1 border border-slate-800">
                    <button type="button" id="role-accountant-btn" onclick="switchRole('accountant')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition"></button>
                    <button type="button" id="role-owner-btn" onclick="switchRole('owner')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition"></button>
                </div>

                <!-- Language Switcher -->
                <button type="button" id="lang-toggle-btn" onclick="toggleLanguage()" class="px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                    عربي
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-4 sm:py-6 space-y-5">
        <!-- Owner Banner Only (Accountant explanatory banner intentionally omitted) -->
        <div id="owner-status-banner" class="hidden rounded-2xl bg-amber-950/50 border border-amber-700/60 px-4 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
            <div class="text-xs sm:text-sm text-amber-200 font-medium" id="owner-banner-text"></div>
            <div class="flex items-center gap-2 flex-wrap">
                <button type="button" id="btn-close-month" onclick="closeCurrentMonth()" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-rose-600 hover:bg-rose-500 text-white shadow transition"></button>
            </div>
        </div>

        <!-- Navigation Tabs (Accountant only sees Subscribers, Expenses, Payments) -->
        <nav class="flex items-center gap-2 overflow-x-auto pb-1">
            <button type="button" id="tab-subscribers" onclick="switchTab('subscribers')" class="tab-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition"></button>
            <button type="button" id="tab-expenses" onclick="switchTab('expenses')" class="tab-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition"></button>
            <button type="button" id="tab-payments" onclick="switchTab('payments')" class="tab-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition"></button>
            <button type="button" id="tab-archive" onclick="switchTab('archive')" class="tab-btn hidden px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition"></button>
            <button type="button" id="tab-settings" onclick="switchTab('settings')" class="tab-btn hidden px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition"></button>
        </nav>

        <!-- TAB 1: SUBSCRIBERS -->
        <section id="section-subscribers" class="space-y-4">
            <!-- Owner Add Subscriber Form -->
            <div id="owner-add-subscriber-panel" class="hidden rounded-2xl bg-slate-900 border border-slate-800 p-4 sm:p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 id="lbl-add-subscriber" class="text-base sm:text-lg font-bold text-white"></h2>
                    <span id="lbl-rate-info" class="text-xs text-amber-300 font-semibold"></span>
                </div>
                <form id="add-subscriber-form" onsubmit="handleAddSubscriber(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">
                    <div>
                        <label id="lbl-sub-code" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="text" id="sub-code" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div class="lg:col-span-2">
                        <label id="lbl-sub-name" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="text" id="sub-name" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label id="lbl-sub-phone" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="text" id="sub-phone" placeholder="0770..." class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label id="lbl-sub-amps" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="number" id="sub-amps" min="0" step="0.5" value="5" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label id="lbl-sub-days" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="number" id="sub-days" min="1" max="31" value="30" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label id="lbl-sub-prev-debt" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="number" id="sub-prev-debt" min="0" step="250" value="0" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div class="sm:col-span-2 lg:col-span-5 flex items-end">
                        <button type="submit" id="btn-add-subscriber" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold transition"></button>
                    </div>
                </form>

                <!-- Import Subscribers via Excel / CSV File -->
                <div class="pt-3 border-t border-slate-800 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                    <div class="space-y-0.5">
                        <p id="lbl-excel-import-title" class="text-xs sm:text-sm font-bold text-sky-300"></p>
                        <p id="lbl-excel-import-desc" class="text-xs text-slate-400"></p>
                    </div>
                    <div class="flex items-center gap-2 flex-wrap">
                        <button type="button" id="btn-download-excel-template" onclick="downloadSubscriberExcelTemplate()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 text-xs sm:text-sm font-semibold transition"></button>
                        <label class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs sm:text-sm font-bold cursor-pointer transition">
                            <span id="btn-import-excel-label"></span>
                            <input type="file" id="excel-subscriber-file" accept=".xlsx,.xls,.csv" onchange="handleImportSubscribersExcel(event)" class="hidden">
                        </label>
                    </div>
                </div>
            </div>

            <!-- Search, Filter & SORT Controls -->
            <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3.5 sm:p-4 flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
                <div class="flex-1">
                    <input type="text" id="search-input" oninput="renderSubscribers()" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <select id="status-filter" onchange="renderSubscribers()" class="rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-xs sm:text-sm text-slate-200 focus:outline-none">
                        <option value="all" id="opt-filter-all"></option>
                        <option value="paid" id="opt-filter-paid"></option>
                        <option value="unpaid" id="opt-filter-unpaid"></option>
                        <option value="inactive" id="opt-filter-inactive"></option>
                    </select>
                    <div class="flex items-center gap-1.5 bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-1.5">
                        <span class="text-xs font-extrabold text-amber-400">SORT</span>
                        <select id="sort-select" onchange="renderSubscribers()" class="bg-transparent text-xs sm:text-sm text-slate-200 focus:outline-none">
                            <option value="code" id="opt-sort-code"></option>
                            <option value="name" id="opt-sort-name"></option>
                            <option value="amps" id="opt-sort-amps"></option>
                            <option value="remaining" id="opt-sort-remaining"></option>
                            <option value="status" id="opt-sort-status"></option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Legend -->
            <div class="flex flex-wrap items-center gap-4 text-xs text-slate-300 px-1">
                <span class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded bg-emerald-600 inline-block"></span><span id="legend-paid"></span></span>
                <span class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded bg-red-800 inline-block"></span><span id="legend-unpaid"></span></span>
                <span class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded bg-slate-800 border border-slate-500 inline-block"></span><span id="legend-inactive"></span></span>
            </div>

            <!-- Single-Column Vertical List of Rectangular Subscriber Cards -->
            <div id="subscribers-list" class="flex flex-col gap-3"></div>
        </section>

        <!-- TAB 2: EXPENSES -->
        <section id="section-expenses" class="hidden space-y-4">
            <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 sm:p-5 space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                    <h2 id="lbl-expenses-title" class="text-base sm:text-lg font-bold text-white"></h2>
                    <div class="text-xs sm:text-sm font-bold text-rose-300 bg-rose-950/60 border border-rose-800/60 px-3.5 py-1.5 rounded-xl tabular-nums">
                        <span id="lbl-total-expenses-inline"></span>: <span id="expenses-total-value">0</span>
                    </div>
                </div>
                <form id="add-expense-form" onsubmit="handleAddExpense(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <div class="sm:col-span-2">
                        <label id="lbl-expense-desc" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="text" id="expense-desc" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500">
                    </div>
                    <div>
                        <label id="lbl-expense-amount" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="number" id="expense-amount" min="250" step="250" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" id="btn-add-expense" class="w-full px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-bold transition"></button>
                    </div>
                </form>
            </div>

            <div id="expenses-list" class="space-y-2.5"></div>
        </section>

        <!-- TAB 3: PAYMENTS & APPROVAL -->
        <section id="section-payments" class="hidden space-y-4">
            <!-- Unapproved Payments Total (Expenses Deducted, Resets to 0 After Approval) -->
            <div class="rounded-2xl bg-gradient-to-l from-amber-950/80 to-slate-900 border border-amber-700/60 p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <p id="lbl-unapproved-total" class="text-xs sm:text-sm font-semibold text-amber-300"></p>
                    <p id="unapproved-net-total" class="text-2xl sm:text-3xl font-extrabold text-white mt-1 tabular-nums">0</p>
                    <p id="lbl-unapproved-breakdown" class="text-xs text-slate-300 mt-1 tabular-nums"></p>
                </div>
                <div id="owner-approve-all-wrap" class="hidden">
                    <button type="button" id="btn-approve-all" onclick="approveAllPayments()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold shadow transition"></button>
                </div>
            </div>

            <!-- Payments List -->
            <div id="payments-list" class="space-y-2.5"></div>
        </section>

        <!-- TAB 4: OWNER ARCHIVE (DAY & MONTH CALENDAR + EDITABLE) -->
        <section id="section-archive" class="hidden space-y-4">
            <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 sm:p-5 space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                    <div>
                        <h2 id="lbl-archive-title" class="text-base sm:text-lg font-bold text-white"></h2>
                        <p id="lbl-archive-subtitle" class="text-xs text-slate-400 mt-0.5"></p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" id="btn-archive-day" onclick="setArchiveView('day')" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-sky-600 text-white transition"></button>
                        <button type="button" id="btn-archive-month" onclick="setArchiveView('month')" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-800 text-slate-200 border border-slate-700 transition"></button>
                    </div>
                </div>

                <!-- Day Calendar View -->
                <div id="archive-day-panel" class="space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center gap-3">
                        <label id="lbl-select-date" class="text-xs sm:text-sm font-semibold text-slate-300"></label>
                        <input type="date" id="archive-date-picker" onchange="renderArchive()" class="rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
                    </div>
                    <div id="archive-day-content" class="space-y-3"></div>
                </div>

                <!-- Month Calendar View -->
                <div id="archive-month-panel" class="hidden space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center gap-3">
                        <label id="lbl-select-month" class="text-xs sm:text-sm font-semibold text-slate-300"></label>
                        <input type="month" id="archive-month-picker" onchange="renderArchive()" class="rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
                    </div>
                    <div id="archive-month-content" class="space-y-3"></div>
                </div>
            </div>
        </section>

        <!-- TAB 5: OWNER SETTINGS -->
        <section id="section-settings" class="hidden space-y-4">
            <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 sm:p-5 space-y-4">
                <h2 id="lbl-settings-title" class="text-base sm:text-lg font-bold text-white"></h2>
                <form id="settings-form" onsubmit="handleSaveSettings(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="lg:col-span-2">
                        <label id="lbl-set-gen-name" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="text" id="set-gen-name" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label id="lbl-set-month" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="text" id="set-month" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label id="lbl-set-pin" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="text" id="set-pin" maxlength="6" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label id="lbl-set-amp-price" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="number" id="set-amp-price" min="500" step="250" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label id="lbl-set-base-days" class="block text-xs text-slate-400 mb-1"></label>
                        <input type="number" id="set-base-days" min="1" max="31" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div class="sm:col-span-2 flex items-end gap-3 flex-wrap">
                        <button type="submit" id="btn-save-settings" class="px-5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-sm font-bold transition"></button>
                        <button type="button" id="btn-reset-demo" onclick="resetDemoData()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-rose-300 border border-slate-700 text-sm font-semibold transition"></button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- PIN Modal for Owner -->
    <div id="pin-modal" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-700 p-5 space-y-4">
            <h3 id="lbl-pin-title" class="text-base font-bold text-white"></h3>
            <p id="lbl-pin-desc" class="text-xs text-slate-400"></p>
            <input type="password" id="pin-input" maxlength="6" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2.5 text-center text-lg tracking-widest text-white focus:outline-none focus:border-amber-500">
            <div class="flex items-center justify-end gap-2">
                <button type="button" id="btn-pin-cancel" onclick="closePinModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs sm:text-sm font-semibold"></button>
                <button type="button" id="btn-pin-confirm" onclick="handleVerifyPin()" class="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs sm:text-sm font-bold"></button>
            </div>
        </div>
    </div>

    <!-- Collect / Edit Payment Modal -->
    <div id="payment-modal" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-md rounded-2xl bg-slate-900 border border-slate-700 p-5 space-y-4">
            <div class="flex items-center justify-between">
                <h3 id="lbl-payment-modal-title" class="text-base font-bold text-white"></h3>
                <button type="button" onclick="closePaymentModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
            </div>
            <div id="payment-sub-summary" class="rounded-xl bg-slate-950 border border-slate-800 p-3 text-xs text-slate-300 space-y-1"></div>
            <form onsubmit="handleSubmitPayment(event)" class="space-y-3">
                <div>
                    <label id="lbl-payment-amount" class="block text-xs text-slate-400 mb-1"></label>
                    <input type="number" id="payment-amount-input" min="250" step="250" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label id="lbl-payment-note" class="block text-xs text-slate-400 mb-1"></label>
                    <input type="text" id="payment-note-input" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <!-- Optional Print Receipt Toggle -->
                <label class="flex items-center gap-2.5 text-xs sm:text-sm text-slate-200 cursor-pointer pt-1">
                    <input type="checkbox" id="payment-print-checkbox" class="w-4 h-4 rounded accent-emerald-500">
                    <span id="lbl-optional-print"></span>
                </label>
                <div class="flex items-center justify-end gap-2 pt-2">

        function loadInitialState() {
            const fallback = createInitialState();
            try {
                const liveRaw = localStorage.getItem(`${STORAGE_KEY}__live_${SESSION_ROOM_ID}`);
                if (liveRaw) {
                    const parsedLive = JSON.parse(liveRaw);
                    if (parsedLive && parsedLive.data) {
                        lastSyncTimestamp = Number(parsedLive.updatedAt) || 0;
                        return { ...fallback, ...parsedLive.data, settings: { ...fallback.settings, ...(parsedLive.data.settings || {}) } };
                    }
                }
                const localRaw = localStorage.getItem(STORAGE_KEY);
                if (localRaw) {
                    const parsedLocal = JSON.parse(localRaw);
                    return { ...fallback, ...parsedLocal, settings: { ...fallback.settings, ...(parsedLocal.settings || {}) } };
                }
            } catch (err) {
                // Fallback to default state
            }
            return fallback;
        }

        let state = loadInitialState();
        let pendingPaymentSubscriberId = null;
        let pendingEditingPaymentId = null;
        let pendingEditingSubscriberId = null;

        try {
            if (typeof BroadcastChannel !== 'undefined') {
                syncChannel = new BroadcastChannel(`${SYNC_CHANNEL_NAME}_${SESSION_ROOM_ID}`);
                syncChannel.onmessage = (event) => {
                    const payload = event?.data;
                    if (!payload || payload.senderId === CLIENT_INSTANCE_ID) return;
                    if (payload.type === 'state_update' && payload.state) {
                        applyRemoteState(payload.state, payload.updatedAt || Date.now());
                    }
                };
            }
        } catch (err) {
            syncChannel = null;
        }

        function applyRemoteState(remoteData, remoteTimestamp = Date.now()) {
            const ts = Number(remoteTimestamp) || Date.now();
            if (ts < lastSyncTimestamp) return;
            lastSyncTimestamp = ts;
            isApplyingRemoteUpdate = true;
            try {
                const currentRole = state.role;
                const currentTab = state.activeTab;
                state = {
                    ...state,
                    ...remoteData,
                    role: currentRole,
                    activeTab: currentTab,
                    settings: {
                        ...state.settings,
                        ...(remoteData.settings || {})
                    }
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                renderAll();
            } finally {

            }
        }

        function saveState() {
            try {
                const updatedAt = Date.now();
                lastSyncTimestamp = updatedAt;
                const envelope = {
                    roomId: SESSION_ROOM_ID,
                    updatedAt,
                    senderId: CLIENT_INSTANCE_ID,
                    data: state
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                localStorage.setItem(`${STORAGE_KEY}__live_${SESSION_ROOM_ID}`, JSON.stringify(envelope));

                if (!isApplyingRemoteUpdate && syncChannel) {
                    syncChannel.postMessage({
                        type: 'state_update',
                        roomId: SESSION_ROOM_ID,
                        updatedAt,
                        senderId: CLIENT_INSTANCE_ID,
                        state
                    });
                }

                if (!isApplyingRemoteUpdate && isCloudReady && cloudDocRef) {
                    scheduleCloudSave(envelope);
                }
            } catch (err) {
                // Ignore storage errors
            }
        }

        function scheduleCloudSave(envelope) {
            if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
            cloudSaveTimer = setTimeout(async () => {
                try {
                    if (!auth?.currentUser || !cloudDocRef) return;
                    const { role, activeTab, ...sharedData } = envelope.data;
                    await setDoc(cloudDocRef, {
                        roomId: SESSION_ROOM_ID,
                        updatedAt: envelope.updatedAt,
                        senderId: CLIENT_INSTANCE_ID,
                        data: sharedData
                    }, { merge: true });
                } catch (err) {
                    // Ignore cloud write error
                }
            }, 250);
        }

        async function initCloudSync() {
            if (!rawFirebaseConfig) return;
            try {
                const firebaseConfig = JSON.parse(rawFirebaseConfig);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                if (!auth.currentUser) return;

                cloudDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'generator_rooms', SESSION_ROOM_ID);
                isCloudReady = true;

                onSnapshot(
                    cloudDocRef,
                    (snapshot) => {
                        if (!snapshot.exists()) {
                            const { role, activeTab, ...initialShared } = state;
                            setDoc(cloudDocRef, {
                                roomId: SESSION_ROOM_ID,
                                updatedAt: Date.now(),
                                senderId: CLIENT_INSTANCE_ID,
                                data: initialShared
                            }, { merge: true }).catch(() => {});
                            return;
                        }
                        const remote = snapshot.data();
                        if (!remote || remote.senderId === CLIENT_INSTANCE_ID || !remote.data) return;
                        applyRemoteState(remote.data, remote.updatedAt || Date.now());
                    },
                    () => {
                        // Ignore listener error
                    }
                );
            } catch (err) {
                isCloudReady = false;
            }
        }

        // Calculate subscriber charge based on pro-rated days + previous debt
        function calculateSubscriberFinancials(sub) {
            const ampPrice = Number(state.settings.ampPrice) || 12000;
            const baseDays = Math.max(1, Number(state.settings.baseDays) || 30);
            const amps = Number(sub.amps) || 0;
            const days = Math.max(0, Number(sub.days) || 0);
            const prevDebt = Number(sub.previousDebt) || 0;

            const currentPeriodCharge = sub.active
                ? Math.round((amps * ampPrice * days) / baseDays)
                : 0;
            const totalDue = currentPeriodCharge + prevDebt;

            const subPayments = state.payments.filter((p) => p.subscriberId === sub.id);
            const paidAmount = subPayments.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
            const remainingAmount = Math.max(0, totalDue - paidAmount);

            let status = 'unpaid';
            if (!sub.active && remainingAmount <= 0) {
                status = 'inactive';
            } else if (remainingAmount <= 0 && totalDue > 0) {
                status = 'paid';
            } else if (!sub.active) {
                status = 'inactive';
            } else {
                status = 'unpaid';
            }

            return {
                currentPeriodCharge,
                totalDue,
                paidAmount,
                remainingAmount,
                status
            };
        }

        function normalizeExcelRow(row) {
            if (!row || typeof row !== 'object') return null;
            const entries = Object.entries(row).reduce((acc, [k, v]) => {
                acc[String(k).trim().toLowerCase()] = v;
                return acc;
            }, {});

            const codeRaw = entries['code'] ?? entries['کۆد'] ?? entries['الرمز'] ?? '';
            const nameRaw = entries['name'] ?? entries['ناو'] ?? entries['ناوی بەشداربوو'] ?? entries['الاسم'] ?? entries['اسم المشترك'] ?? '';
            const phoneRaw = entries['phone'] ?? entries['مۆبایل'] ?? entries['مۆبایل (واتسئەپ)'] ?? entries['الهاتف'] ?? entries['الهاتف (واتساب)'] ?? '';
            const ampsRaw = entries['amps'] ?? entries['amp'] ?? entries['ئەمپێر'] ?? entries['الأمبير'] ?? state.settings.baseAmps ?? 5;
            const daysRaw = entries['days'] ?? entries['ڕۆژ'] ?? entries['الأيام'] ?? state.settings.baseDays ?? 30;
            const prevDebtRaw = entries['previousdebt'] ?? entries['prevdebt'] ?? entries['قەرزی پێشوو'] ?? entries['دين سابق'] ?? 0;

            const name = String(nameRaw || '').trim();
            if (!name) return null;

            const code = String(codeRaw || '').trim() || `SUB-${Math.floor(100 + Math.random() * 900)}`;
            const phone = String(phoneRaw || '').trim();
            const amps = Math.max(0, Number(ampsRaw) || 0);
            const days = Math.min(31, Math.max(1, Number(daysRaw) || Number(state.settings.baseDays) || 30));
            const previousDebt = Math.max(0, Number(prevDebtRaw) || 0);

            return {
                id: 'sub_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                code,
                name,
                phone,
                amps,
                days,
                previousDebt,
                active: true
            };
        }

        function handleImportSubscribersExcel(event) {
            if (state.role !== 'owner') return;
            const file = event?.target?.files?.[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    if (typeof XLSX === 'undefined') {
                        showToast(t('excelErrorToast'));
                        return;
                    }
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

                    const importedSubs = [];
                    rows.forEach((row) => {
                        const sub = normalizeExcelRow(row);
                        if (sub) importedSubs.push(sub);
                    });

                    if (importedSubs.length === 0) {
                        showToast(t('excelNoRowsToast'));
                        return;
                    }

                    state.subscribers = [...importedSubs, ...state.subscribers];
                    saveState();
                    renderAll();
                    showToast(t('excelImportedToast').replace('{count}', String(importedSubs.length)));
                } catch (err) {
                    showToast(t('excelErrorToast'));
                } finally {
                    event.target.value = '';
                }
            };
            reader.onerror = () => {
                showToast(t('excelErrorToast'));
                event.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        function closeCurrentMonth() {
            if (state.role !== 'owner') return;

            const monthKey = getCurrentMonthISO();
            let carriedForwardTotal = 0;
            let totalPaidInMonth = 0;
            let totalExpensesInMonth = state.expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);

            state.subscribers.forEach((sub) => {
                const fin = calculateSubscriberFinancials(sub);
                totalPaidInMonth += fin.paidAmount;
                const unpaidCarry = fin.remainingAmount;
                carriedForwardTotal += unpaidCarry;
                sub.previousDebt = unpaidCarry;
                sub.days = Number(state.settings.baseDays) || 30;
            });

            state.monthlyArchive[monthKey] = {
                monthKey,
                label: state.settings.currentMonthLabel,
                closedAt: getTodayISO(),
                totalPaidInMonth,
                totalExpensesInMonth,
                carriedForwardTotal,
                subscriberCount: state.subscribers.length
            };

            state.payments = [];
            state.expenses = [];

            saveState();
            renderAll();
            showToast(t('monthClosedToast'));
        }
